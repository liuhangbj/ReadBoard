name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: App/ReadBoard/Sources/ReadBoard/Resources/engine/package-lock.json

      - name: Install full-text engine dependencies
        run: npm ci --omit=dev --prefix App/ReadBoard/Sources/ReadBoard/Resources/engine

      - name: Reject runtime data and compiled apps
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Data|Runtime)/|\.app/|\.db($|-)|secrets\.json$'; then
            echo "Runtime data or compiled artifacts must not be tracked."
            exit 1
          fi

      - name: Build
        run: swift build --package-path App/ReadBoard

      - name: Test with isolated database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readboard-tests"
          READBOARD_DB="$RUNNER_TEMP/readboard-tests/readboard.db" \
            swift test --package-path App/ReadBoard

      - name: Assemble app bundle
        shell: bash
        run: |
          set -euo pipefail
          READBOARD_OUTPUT_DIR="$RUNNER_TEMP/readboard-package" \
            App/ReadBoard/Scripts/package_app.sh
          codesign --verify --deep --strict \
            "$RUNNER_TEMP/readboard-package/ReadBoard.app"
          test -f "$RUNNER_TEMP/readboard-package/ReadBoard.app/Contents/Resources/migrations/027_reader_performance.sql"
          test -f "$RUNNER_TEMP/readboard-package/ReadBoard.app/Contents/Resources/engine/fetch_engine.js"
