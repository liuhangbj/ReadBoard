name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.9.4-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must look like v0.9.4-beta.1"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Sources/ReadBoard/Resources/engine/package-lock.json

      - name: Install full-text engine dependencies
        run: npm ci --omit=dev --prefix Sources/ReadBoard/Resources/engine

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          READBOARD_OUTPUT_DIR="$RUNNER_TEMP/release" \
          READBOARD_VERSION="$RELEASE_VERSION" \
          READBOARD_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            Scripts/package_app.sh

      - name: Sign and notarize (if credentials available)
        if: env.DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/readboard-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "Developer ID Application identity not found"; exit 1; }

          codesign --deep --force --sign "$IDENTITY" \
            --options runtime \
            "$RUNNER_TEMP/release/ReadBoard.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/release/ReadBoard.app"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          SUBMISSION_ZIP="$RUNNER_TEMP/ReadBoard-notarization.zip"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          ditto -c -k --keepParent "$RUNNER_TEMP/release/ReadBoard.app" "$SUBMISSION_ZIP"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/release/ReadBoard.app"
          xcrun stapler validate "$RUNNER_TEMP/release/ReadBoard.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/release/ReadBoard.app"

          security delete-keychain "$KEYCHAIN_PATH"

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ReadBoard-${RELEASE_VERSION#v}-macOS.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/release/ReadBoard.app" "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          NOTE="未经签名的 macOS 应用。首次打开需右键 → 打开，或在系统设置中放行。"
          FLAGS=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" "$ARCHIVE_PATH" \
            --target "$GITHUB_SHA" \
            --title "ReadBoard $RELEASE_VERSION" \
            --notes "$NOTE" \
            --generate-notes "${FLAGS[@]}"
